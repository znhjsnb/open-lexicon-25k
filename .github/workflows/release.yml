name: Release Build & Distribution

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build SQLite, Anki, JSONL and Zip Releases
        run: |
          python src/export_databases.py --all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Open-Lexicon 25K ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            data/exports/open_lexicon_25k_sqlite.zip
            data/exports/open_lexicon_25k_anki.zip
            data/exports/open_lexicon_25k_jsonl.zip
