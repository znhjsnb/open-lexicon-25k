": "They borrowed money from a bank to start their business.", "sentence_zh": "他们向银行借钱创业。"}, {"pos": "v. 动词", "phonetic": "/ˈbɒrəʊ/", "meaning_zh": "借鉴；采用；借用词语或创意", "meaning_en": "adopt an idea, word, or feature from another source", "english_definition": "If you borrow an idea, word, or style, you take it from another source and use it for your own purposes.", "collocation_en": "borrow an idea; borrow words from another language", "collocation_zh": "借鉴一个想法；从另一种语言借用词语", "sentence_en": "The designer borrowed ideas from traditional Chinese gardens.", "sentence_zh": "这位设计师借鉴了中国传统园林的设计理念。"}], "etymology_story": {"zh": "borrow 经中古英语 borwen 追溯至古英语 borgian，与表示“担保；抵押物”的 borg 有历史联系。其借入或借出的早期用法后来收窄为现代主要的“借入”，并扩展为借鉴创意、借用词语。", "en": "Borrow comes through Middle English borwen from Old English borgian, historically related to borg, meaning a pledge or security. Earlier uses covered both borrowing and lending; modern English mainly retains the receiving side and extends it to adopting ideas and words."}, "morphology_enriched": {"zh": "borrow 是不可再按现代英语词义拆分的词基，不能拆成 bor + row。常用词族：borrower（借用者；借款人）、borrowing（借用；借款；借词）、borrowings（借款项目或总额；借入的词语或事物）；动词变化为 borrows、borrowed、borrowing，borrowed 也可作分词形容词，表示“借来的；借用的”。", "en": "Borrow is a base word with no useful smaller meaning-bearing parts in modern English; it is not bor + row. Common family members include borrower and the noun borrowing, whose plural borrowings can refer to borrowed funds, words, or other adopted elements. Verb forms are borrows, borrowed, and borrowing; borrowed also functions as a participial adjective."}, "synonyms_and_nuances": {"zh": "take out a loan（贷款）专指取得需要偿还的资金；adopt（采用）强调接受并使用某种方法或观念，不必突出来源；draw on（利用；借鉴）强调从知识、经验或创意中获取资源。borrow 的基本方向是“借入”，与表示“借出”的 lend 相对。", "en": "Take out a loan specifically means obtaining repayable funds; adopt emphasizes accepting and using a method or idea without necessarily highlighting its source; draw on emphasizes using knowledge, experience, or ideas as resources. Borrow describes receiving something temporarily, whereas lend describes providing it."}, "exam_tags": ["中考", "高考", "CET4", "CET6", "考研", "TEM4", "IELTS", "TOEFL", "CEFR-A2"], "mnemonic_anchor": {"zh": "方向锚点：borrow 是“借进来”，lend 是“借出去”；借创意时，保留“从别处取来使用”的逻辑。", "en": "Anchor the direction: borrow brings something in, while lend sends it out; borrowing an idea keeps the logic of taking something from another source to use."}}, {"aliases": ["预算", "预算金额"], "alternatives": {}, "cloze": "My weekly food _____ is fifty dollars.", "collocation": "on a tight budget 预算紧张", "comprehension_check": {"answers": ["计划可花的120英镑", "计划可花的钱", "预算是120英镑，不是已经花的90英镑", "计划用于旅行的一百二十英镑", "budget 指计划可用于旅行的一百二十英镑；九十英镑是目前已经花掉的钱。"], "known_wrong": ["已经花掉的90英镑", "目前已经花掉的钱", "90英镑"], "question": "这次旅行的 budget 是哪笔金额：计划可花的钱，还是目前已经花掉的钱？用中文说明。", "reference": "budget 指计划可用于旅行的一百二十英镑；九十英镑是目前已经花掉的钱。", "sentence": "Our budget for the trip is £120. We have spent £90 so far.", "version": "B03", "wrong_reason": "budget 在这里是预先安排的 £120；£90 是已经发生的支出。"}, "context_hint": "想想 weekly food 与 fifty dollars 的关系：这是花钱前作的安排。", "etymology": {"source": "https://www.merriam-webster.com/dictionary/budget", "text": "中古英语 bowgette 来自法语 bougette，原与小皮袋有关；现代预算义不能按 bud + get 的英语字面来解释。"}, "family": "budgeting 编制预算", "forms": "复数 budgets。budgeted / budgeting 属于动词 budget“编制预算”的形式，不是本课名词的屈折形式。", "hint": "on a tight budget 预算紧张", "id": "budget.n.1", "meaning": "预算", "morphology": {"category": "现代构词说明", "source": "https://www.merriam-webster.com/dictionary/budget", "text": "budget 在本课作为完整词基；末尾 get 不是“得到”的独立构词成分。budgeting 来自动词用法，不能当作预算名词的复数。"}, "needs_context": false, "phonetic": "ˈbʌdʒɪt", "pos": "n. 名词（可数）", "pronunciation": {"dialect": "en-GB", "ipa": "ˈbʌdʒɪt", "label": "英式", "note": "统一用 dʒ 表示塞擦音；旧写法 ʤ 是连字，本身不代表另一个读音。主要英美标音均为 /ˈbʌdʒɪt/。", "source": "https://dictionary.cambridge.org/dictionary/english/budget"}, "question": "这个句子中，budget 是什么意思？用一句简短中文说明。", "relations": [{"meaning": "多个预算；名词复数", "type": "屈折形式", "word": "budgets"}, {"meaning": "编制预算；不计为本课名词义已掌握", "type": "另一义项", "word": "budget (v.)"}], "scenario": "安排这一周的伙食时，你先决定可花五十美元。这是留给伙食的预算额度；一周结束后实际花了多少，要看支出记录。", "sentence": "My weekly food budget is fifty dollars.", "source": {"entryId": "coca-heads-band-03-25-w00088", "location": "coca_heads(03).txt line 88", "originalPos": "n/v/vi/vt", "teaching": "原有 B03 讲解和理解题完整保留；B09 补充用法、形式、发音和关系。词典仅用于核实指定词义、用法、发音及构词/词源；中文说明为原创概述，不是词典逐段译文；其他义项只作边界提示，不算已教。", "wordbook": "D:/dc-coca-bnc/data/wordbooks/coca-heads-band-03-25/groups/group-002.json"}, "sources": [{"label": "Cambridge · budget", "url": "https://dictionary.cambridge.org/dictionary/english/budget"}, {"label": "Merriam-Webster · budget", "url": "https://www.merriam-webster.com/dictionary/budget"}], "teaching": {"contrast": "这里的 budget 是计划可支出的金额。实际支出可以低于、等于或超过它，不能只看已经花了多少钱来判断预算。", "sentence": "Our budget is £80, but we spent only £65.", "source": "https://dictionary.cambridge.org/dictionary/english/budget", "translation": "我们的预算是八十英镑，但实际只花了六十五英镑。预算和已花金额是两件事。"}, "translation": "我每周的伙食预算是五十美元。", "usage_note": "日常和财务语境均常用。a budget for food / a food budget 是伙食预算；on a tight budget 表示可花的钱有限。本课是计划可支出的额度，不是已经发生的支出。", "word": "budget", "senses": [{"pos": "n. 名词", "phonetic": "/ˈbʌdʒɪt/", "meaning_zh": "预算；预算额；可支配的资金或资源", "meaning_en": "a spending plan or an amount of money or resources available for a purpose", "english_definition": "A budget is a plan showing how much money you expect to receive and spend, or the amount of money or other resources available for something.", "collocation_en": "a tight budget; within budget", "collocation_zh": "紧张的预算；在预算范围内", "sentence_en": "We have a limited budget for the project, so we need to control costs.", "sentence_zh": "这个项目的预算有限，因此我们需要控制成本。"}, {"pos": "v. 动词", "phonetic": "/ˈbʌdʒɪt/", "meaning_zh": "编制预算；安排开支；为某事预留资金", "meaning_en": "plan spending or set aside money for a purpose", "english_definition": "If you budget, you plan how to spend your money; if you budget a particular amount for something, you include that amount in your spending plan.", "collocation_en": "budget carefully; budget for repairs", "collocation_zh": "精打细算地安排开支；为维修预留预算", "sentence_en": "We budgeted £500 for repairs this year.", "sentence_zh": "我们今年安排了500英镑的维修预算。"}, {"pos": "v. 动词", "phonetic": "/ˈbʌdʒɪt/", "meaning_zh": "规划或分配时间、精力等资源", "meaning_en": "plan and allocate time, effort, or other limited resources", "english_definition": "If you budget your time or energy, you decide how much to use for each activity so that you have enough for everything you need to do.", "collocation_en": "budget your time; budget time for revision", "collocation_zh": "合理安排时间；为复习预留时间", "sentence_en": "You need to budget your time carefully during the exam.", "sentence_zh": "考试时你需要仔细安排时间。"}, {"pos": "adj. 形容词", "phonetic": "/ˈbʌdʒɪt/", "meaning_zh": "价格低廉的；经济型的", "meaning_en": "inexpensive and intended for people who want to spend less", "english_definition": "Budget goods or services are offered at relatively low prices for people who want to limit their spending.", "collocation_en": "a budget hotel; a budget airline", "collocation_zh": "经济型酒店；廉价航空公司", "sentence_en": "We stayed in a budget hotel near the station.", "sentence_zh": "我们住在车站附近的一家经济型酒店里。"}], "etymology_story": {"zh": "budget 经中古英语 bowgette 来自法语 bougette，原指“小皮袋”，是 bouge（皮袋）的指小形式。后来它与财政文件袋及袋内的收支计划联系起来，逐渐发展为“预算”，再衍生出动词“安排预算”和形容词“经济型的”。", "en": "Budget comes through Middle English bowgette from French bougette, meaning a small leather bag and formed as a diminutive of bouge. Its association with a bag containing financial papers developed into the meaning of a financial plan, followed by the verb meaning 'plan expenditure' and the adjective meaning 'inexpensive.'"}, "morphology_enriched": {"zh": "budget 在现代英语中是完整词基，不能拆成 bud + get；名词、动词和形容词之间存在零派生关系。常用词族：budgetary（预算的）、budgeting（预算编制；动词 -ing 形式）、budgeter（编制或管理预算的人）；变化形式有 budgets、budgeted。相关构词包括 overbudget（预算编得过高）、underbudget（预算编得不足）、budget-friendly（价格实惠的）、low-budget（预算低的）、big-budget（投入巨大的）；over budget 和 under budget 分别表示“超出预算”和“低于预算”。", "en": "Budget is a complete modern base, not bud + get; its noun, verb, and adjective uses are related through conversion without an added suffix. Common family members include budgetary, budgeting, and budgeter, with inflected forms budgets and budgeted. Related formations include overbudget ('set a budget too high'), underbudget ('allow too little'), budget-friendly, low-budget, and big-budget; the phrases over budget and under budget describe spending above or below the planned amount."}, "synonyms_and_nuances": {"zh": "spending plan（开支计划）最接近预算名词，强调预计如何花钱；allocate（分配）与预算动词相近，但强调具体划拨资源，而 budget 强调整体规划及限额；inexpensive（不贵的）与形容词 budget 相近，前者只描述价格，后者常指面向节省开支者的产品或服务类别。", "en": "Spending plan closely matches the noun and emphasizes intended expenditure; allocate overlaps with the verb but focuses on assigning particular resources, while budget emphasizes planning within limits; inexpensive describes a low price, whereas adjectival budget often identifies a category of goods or services aimed at economical spending."}, "exam_tags": ["高考", "CET4", "CET6", "考研", "TEM4", "TEM8", "IELTS", "TOEFL", "SAT", "CEFR-B2"], "mnemonic_anchor": {"zh": "从“小钱袋”串联：袋里有多少是预算，把钱怎么分是做预算，少花钱的选择是经济型。", "en": "Picture a small money bag: its limits suggest a budget, dividing its contents suggests budgeting, and spending less suggests a budget option."}}, {"aliases": ["通勤", "上下班", "往返上下班", "往返工作地点"], "alternatives": {}, "cloze": "Many students _____ to their part-time jobs by bus.", "collocation": "commute to work 通勤上班", "comprehension_check": {"answers": ["每个工作日从家去医院上班", "每天从家到医院工作，规律往返", "去医院上班，因为定期往返家和工作地点", "工作日定期往返家和医院上班", "每个工作日从家去医院上班的行程。它连接住处与工作地点，而且规律重复；每年去海边游玩是另一种出行。"], "known_wrong": ["每年去海边旅游", "去海边度假", "所有出行"], "question": "哪段行程可以用 commute 描述？用中文说明它的两个特点。", "reference": "每个工作日从家去医院上班的行程。它连接住处与工作地点，而且规律重复；每年去海边游玩是另一种出行。", "sentence": "Nora travels from home to the hospital for work every weekday. She visits a seaside town once a year.", "version": "B03", "wrong_reason": "这里考查规律往返家和工作地点的行程，即工作日去医院上班。海边游玩不符合这个场景。"}, "context_hint": "留意 by bus，以及学生的住处和兼职地点这两个地方。", "etymology": {"source": "https://www.merriam-webster.com/dictionary/commute", "text": "历史上来自拉丁语 commutare，意为改变、交换，由 com- 与 mutare 构成；这条线索不能直接推出今天的通勤义。"}, "family": "commuter 通勤者", "forms": "第三人称单数 commutes；过去式、过去分词 commuted；现在分词 commuting（去末尾 e 加 -ing）。", "hint": "commute to work 通勤上班", "id": "commute.v.1", "meaning": "通勤；定期往返于家和工作地点", "morphology": {"category": "现代构词提示", "source": "https://www.merriam-webster.com/dictionary/commute", "text": "commute → commuter，用 -er 表示通勤者，拼写只保留一个 e。不能用现代英语 mute“静音”去解释 commute。"}, "needs_context": false, "phonetic": "kəˈmjuːt", "pos": "v. 动词（本义不及物）", "pronunciation": {"dialect": "en-GB", "ipa": "kəˈmjuːt", "label": "英式", "note": "重音在第二音节；此处英美主要标音相同。", "source": "https://dictionary.cambridge.org/dictionary/english/commute"}, "question": "这个句子中，commute 是什么意思？用一句简短中文说明。", "relations": [{"meaning": "通勤者", "type": "派生词", "word": "commuter"}, {"meaning": "通勤上班", "type": "搭配", "word": "commute to work"}], "scenario": "这些学生住在一个地方，定期乘公交去另一个地方做兼职，再回到住处。commute 把这种住处与工作地点之间的规律往返说出来。", "sentence": "Many students commute to their part-time jobs by bus.", "source": {"entryId": "coca-heads-band-04-25-w00701", "location": "coca_heads(04).txt line 701", "originalPos": "n/v/vt/vi", "teaching": "原有 B03 讲解和理解题完整保留；B09 补充用法、形式、发音和关系。词典仅用于核实指定词义、用法、发音及构词/词源；中文说明为原创概述，不是词典逐段译文；其他义项只作边界提示，不算已教。", "wordbook": "D:/dc-coca-bnc/data/wordbooks/coca-heads-band-04-25/groups/group-015.json"}, "sources": [{"label": "Cambridge · commute", "url": "https://dictionary.cambridge.org/dictionary/english/commute"}, {"label": "Merriam-Webster · commute", "url": "https://www.merriam-webster.com/dictionary/commute"}], "teaching": {"contrast": "这一用法看两个关键点：家与工作地点之间，以及规律往返。乘什么交通工具不是关键；一次度假出行不能仅因路远就叫 commute。", "sentence": "I commute by bike on weekdays; I travel to the coast for holidays.", "source": "https://dictionary.cambridge.org/us/dictionary/english/commute", "translation": "工作日我骑车通勤；假期我去海边旅行。都是出行，但用途与规律不同。"}, "translation": "很多学生乘公交往返于住处和兼职工作地点。", "usage_note": "中性常用语。commute from home to work / commute to work / commute by bus。此课限定规律往返住处和工作地点；交通工具与路程长短本身不决定是否是通勤。", "word": "commute", "senses": [{"pos": "v. 动词（不及物）", "phonetic": "/kəˈmjuːt/", "meaning_zh": "通勤；定期往返于住所与工作或学习地点", "meaning_en": "to travel regularly between home and work or a place of study", "english_definition": "If you commute, you regularly travel between your home and the place where you work or study.", "collocation_en": "commute to work; commute by train", "collocation_zh": "通勤上班；乘火车通勤", "sentence_en": "She commutes to work by train every weekday.", "sentence_zh": "她每个工作日都乘火车通勤上班。"}, {"pos": "n. 名词（可数）", "phonetic": "/kəˈmjuːt/", "meaning_zh": "通勤路程；上下班或上下学的往返行程", "meaning_en": "a regular journey between home and work or a place of study", "english_definition": "Your commute is the journey you regularly make between your home and the place where you work or study.", "collocation_en": "a daily commute; a long commute", "collocation_zh": "每日通勤；漫长的通勤路程", "sentence_en": "My daily commute takes about forty minutes each way.", "sentence_zh": "我每天通勤，单程大约需要四十分钟。"}, {"pos": "v. 动词（及物，法律用语）", "phonetic": "/kəˈmjuːt/", "meaning_zh": "减刑；将刑罚改判为较轻的刑罚", "meaning_en": "to replace a punishment with a less severe one", "english_definition": "If an authority commutes a sentence, it officially replaces that punishment with a less severe one.", "collocation_en": "commute a sentence; commute a death sentence to life imprisonment", "collocation_zh": "减刑；将死刑减为终身监禁", "sentence_en": "The governor commuted his death sentence to life imprisonment.", "sentence_zh": "州长将他的死刑减为终身监禁。"}, {"pos": "v. 动词（及物，财务用语）", "phonetic": "/kəˈmjuːt/", "meaning_zh": "折算支付；将定期付款或养老金权益折为一次性付款", "meaning_en": "to exchange regular payments or pension rights for a single payment", "english_definition": "If you commute a pension or other regular payments, you exchange all or part of them for a single payment.", "collocation_en": "commute a pension; commute pension benefits into a lump sum", "collocation_zh": "将养老金折为一次性付款；将养老金权益折算为一笔款项", "sentence_en": "She chose to commute part of her pension into a lump sum.", "sentence_zh": "她选择将部分养老金折算为一次性付款。"}], "etymology_story": {"zh": "commute 源自拉丁语 commūtāre，意为“改变、交换”，由 com-（共同、一起）与 mūtāre（改变）构成，英语中的减刑和折算支付义保留了“以一种形式替换另一种形式”的线索。通勤义经由美国铁路的 commutation ticket（以优惠价格供定期乘车使用的车票）发展而来，随后用于指持此类车票定期往返，不能仅凭拉丁语词根直接推出。", "en": "Commute comes from Latin commūtāre, meaning 'to change or exchange', formed from com- ('together') and mūtāre ('to change'); its punishment and payment senses preserve the idea of replacing one form with another. The travel sense developed through American railway commutation tickets, which offered reduced fares for regular travel, and subsequently came to describe the regular journeys themselves."}, "morphology_enriched": {"zh": "现代英语中 commute 通常作为完整词干使用，不宜拆成 com- + mute，更与 mute“静音”无关；动词 commute 可零派生为名词 commute。主要词族：commute + -er → commuter（通勤者，直接加 r，保留原有 e）；commute 去 e + -ing → commuting（通勤）；commute + -d → commuted（通勤、减刑或折算的过去式及过去分词）；commute 去 e + -able → commutable（可通勤到达的；可减刑或折算的），以及 commutability（可折算性等）；commutation（减刑；折算支付，采用 commut- 词干）。复合派生包括 telecommute（远程办公）、telecommuter（远程办公者）、telecommuting（远程办公），以及 noncommutable（不可减刑或折算的）、uncommuted（未减刑或未折算的）。共享历史词根的专业词族还包括 commutative（满足交换律的）、commutativity（交换性）、noncommutative（不满足交换律的）、noncommutativity（非交换性）和 commutator（换向器；数学中的交换子），不应将这些专业含义混入日常通勤义。", "en": "In modern English, commute is normally treated as a whole stem, not as com- + mute, and it is unrelated to mute meaning 'silent'; the verb also forms the noun commute by conversion. The principal family includes commute + -er → commuter (add r directly, retaining the existing e); commute minus e + -ing → commuting; commute + -d → commuted; commute minus e + -able → commutable ('within commuting reach' or 'capable of being commuted'), with commutability; and commutation ('sentence reduction' or 'conversion of payments'), using the stem commut-. Further formations include telecommute, telecommuter, telecommuting, noncommutable, and uncommuted. Specialized relatives sharing the historical root include commutative, commutativity, noncommutative, noncommutativity, and commutator; their mathematical or electrical meanings are distinct from everyday commuting."}, "synonyms_and_nuances": {"zh": "travel（旅行、出行）范围最广，commute 特指住所与工作或学习地点之间的规律性往返；reduce（减少、减轻）用于刑罚时强调程度或期限降低，commute 强调由有权机关正式改为较轻刑罚；convert（转换）适用于多种形式变化，commute 在财务语境中特指将定期付款等折为另一种支付形式，通常为一次性付款。", "en": "Travel covers journeys generally, whereas commute specifically describes regular journeys between home and work or study. Reduce emphasizes lowering a punishment's severity or duration, whereas commute emphasizes its official replacement with a less severe punishment. Convert describes many changes of form, whereas financial commute specifically concerns exchanging payment arrangements, usually regular payments for a lump sum."}, "exam_tags": ["CET6", "考研", "IELTS", "TOEFL", "CEFR-C1"], "mnemonic_anchor": {"zh": "先记“替换”：重刑换轻刑，定期付款换一次付款；再接历史桥梁“优惠定期车票 → 日常往返 → 通勤”。", "en": "Start with replacement: a lighter sentence replaces a harsher one, and a lump sum replaces regular payments; then remember the historical bridge: reduced-fare regular-travel ticket → repeated journeys → commuting."}}];
let activeIndex = 0;
let langMode = 'both'; // 'both', 'en', 'zh'

function setLangMode(mode) {
  langMode = mode;
  document.querySelectorAll('.lang-toggle').forEach(b => b.classList.remove('active', 'text-white'));
  document.getElementById('btn-' + mode).classList.add('active', 'text-white');
  renderWordDetail();
}

function renderTabs() {
  const container = document.getElementById('tabsContainer');
  container.innerHTML = words.map((w, idx) => {
    const senseCount = (w.senses || []).length;
    return `
      <button onclick="selectWord(${idx})" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 bg-slate-900 text-slate-300 hover:border-slate-500 transition ${idx === activeIndex ? 'active' : ''}">
        ${w.word} <span class="text-xs text-amber-400 font-mono ml-1">(${senseCount} 词性)</span>
      </button>
    `;
  }).join('');
}

function selectWord(idx) {
  activeIndex = idx;
  renderTabs();
  renderWordDetail();
}

function renderWordDetail() {
  const w = words[activeIndex];
  const container = document.getElementById('wordView');

  const tagsHtml = (w.exam_tags || []).map(t => `<span class="px-2 py-0.5 rounded text-xs font-semibold bg-sky-950 text-sky-300 border border-sky-800">${t}</span>`).join(' ');

  // Bilingual Etymology
  const etym = w.etymology_story || {};
  const etymZh = typeof etym === 'object' ? (etym.zh || '') : String(etym);
  const etymEn = typeof etym === 'object' ? (etym.en || '') : '';

  // Bilingual Morphology
  const morph = w.morphology_enriched || w.morphology || {};
  const morphZh = typeof morph === 'object' ? (morph.zh || morph.text || '') : String(morph);
  const morphEn = typeof morph === 'object' ? (morph.en || '') : '';

  // Bilingual Synonyms
  const syn = w.synonyms_and_nuances || {};
  const synZh = typeof syn === 'object' ? (syn.zh || '') : String(syn);
  const synEn = typeof syn === 'object' ? (syn.en || '') : '';

  // Bilingual Mnemonic
  const mnem = w.mnemonic_anchor || {};
  const mnemZh = typeof mnem === 'object' ? (mnem.zh || '') : String(mnem);
  const mnemEn = typeof mnem === 'object' ? (mnem.en || '') : '';

  // Render Senses
  const senses = w.senses || [];
  const sensesHtml = senses.map((s, sIdx) => {
    const showZh = langMode !== 'en';
    const showEn = langMode !== 'zh';

    return `
      <div class="bg-slate-950/80 border border-slate-800 rounded-xl p-4 space-y-2.5">
        <div class="flex items-baseline justify-between border-b border-slate-800/80 pb-2">
          <div class="flex items-baseline gap-2 flex-wrap">
            <span class="px-2 py-0.5 rounded text-xs font-bold bg-amber-950 text-amber-400 border border-amber-800/80">${s.pos || ''}</span>
            <span class="font-mono text-slate-400 text-xs">${s.phonetic || ''}</span>
            ${showZh ? `<span class="text-slate-100 font-semibold text-sm ml-2">${s.meaning_zh || s.meaning || ''}</span>` : ''}
            ${showEn ? `<span class="text-sky-300 font-medium text-xs italic ml-2">(${s.meaning_en || ''})</span>` : ''}
          </div>
          <span class="text-xs text-slate-500">Sense #${sIdx + 1}</span>
        </div>

        ${showEn ? `
        <div class="text-xs text-sky-200 italic bg-sky-950/30 p-2.5 rounded border border-sky-900/40">
          <strong class="text-sky-400 not-italic">COBUILD:</strong> "${s.english_definition || ''}"
        </div>
        ` : ''}

        <div class="text-xs text-slate-300">
          <strong class="text-slate-400">搭配 Collocation:</strong> 
          <code class="text-pink-300 bg-slate-900 px-1.5 py-0.5 rounded">${s.collocation_en || s.collocation || ''}</code>
          ${showZh && s.collocation_zh ? `<span class="text-slate-400 ml-2">（${s.collocation_zh}）</span>` : ''}
        </div>

        <div class="text-xs text-slate-200 border-l-2 border-sky-500 pl-2.5 py-0.5 space-y-1">
          <div class="text-slate-200">${s.sentence_en || s.sentence || ''}</div>
          ${showZh ? `<div class="text-slate-400 text-xs">${s.sentence_zh || s.translation || ''}</div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  const showZh = langMode !== 'en';
  const showEn = langMode !== 'zh';

  container.innerHTML = `
    <!-- Top Identity Card -->
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-lg">
      <div class="flex flex-wrap items-baseline justify-between gap-4 border-b border-slate-800 pb-4">
        <div class="flex items-baseline gap-4">
          <span class="text-4xl font-extrabold text-sky-400 tracking-tight">${w.word}</span>
          <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-blue-950 text-blue-300 border border-blue-800">
            涵盖 ${senses.length} 个常用全功能词性 · 全双语对照
          </span>
        </div>
        <div class="flex flex-wrap gap-2">
          ${tagsHtml}
        </div>
      </div>

      <!-- Multi-Senses Grid -->
      <div class="mt-4 space-y-3">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400">多词性义项全景 (Bilingual Senses)</div>
        <div class="grid grid-cols-1 md:grid-cols-${Math.min(senses.length, 2)} gap-4">
          ${sensesHtml}
        </div>
      </div>
    </div>

    <!-- 4-Grid Core Knowledge Modules -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-5">

      <!-- 1. 词汇历史来源与演化 (Bilingual Etymology) -->
      <div class="bg-slate-900/90 border border-amber-900/50 rounded-xl p-5 shadow-sm space-y-3">
        <div class="flex items-center gap-2 text-amber-400 font-semibold border-b border-slate-800 pb-2.5">
          <span>🏛️</span> <span>来源历史与演化 (Historical Etymology & Evolution)</span>
        </div>
        <div class="space-y-2">
          ${showZh && etymZh ? `<div class="text-xs text-slate-200 leading-relaxed bg-amber-950/20 p-3 rounded-lg border border-amber-900/40">${etymZh}</div>` : ''}
          ${showEn && etymEn ? `<div class="text-xs text-amber-200/90 italic font-serif leading-relaxed bg-amber-950/30 p-3 rounded-lg border border-amber-900/40">${etymEn}</div>` : ''}
        </div>
      </div>

      <!-- 2. 现代公式化构词拆解与全词族 (Bilingual Morphology) -->
      <div class="bg-slate-900/90 border border-indigo-900/50 rounded-xl p-5 shadow-sm space-y-3">
        <div class="flex items-center gap-2 text-indigo-400 font-semibold border-b border-slate-800 pb-2.5">
          <span>🧩</span> <span>形态构词与词族 (Morphology & Word Family)</span>
        </div>
        <div class="space-y-2">
          ${showZh && morphZh ? `<div class="text-xs text-slate-200 leading-relaxed bg-indigo-950/20 p-3 rounded-lg border border-indigo-900/40">${morphZh}</div>` : ''}
          ${showEn && morphEn ? `<div class="text-xs text-indigo-200/90 italic leading-relaxed bg-indigo-950/30 p-3 rounded-lg border border-indigo-900/40">${morphEn}</div>` : ''}
        </div>
      </div>

      <!-- 3. 近义微雕辨析 (Bilingual Nuances) -->
      <div class="bg-slate-900/90 border border-rose-900/50 rounded-xl p-5 shadow-sm space-y-3">
        <div class="flex items-center gap-2 text-rose-400 font-semibold border-b border-slate-800 pb-2.5">
          <span>⚖️</span> <span>近义微雕辨析 (Synonym Nuances)</span>
        </div>
        <div class="space-y-2">
          ${showZh && synZh ? `<div class="text-xs text-slate-200 leading-relaxed bg-rose-950/20 p-3 rounded-lg border border-rose-900/40">${synZh}</div>` : ''}
          ${showEn && synEn ? `<div class="text-xs text-rose-200/90 italic leading-relaxed bg-rose-950/30 p-3 rounded-lg border border-rose-900/40">${synEn}</div>` : ''}
        </div>
      </div>

      <!-- 4. 认知记忆秒记锚点 (Bilingual Mnemonic) -->
      <div class="bg-slate-900/90 border border-emerald-900/50 rounded-xl p-5 shadow-sm space-y-3">
        <div class="flex items-center gap-2 text-emerald-400 font-semibold border-b border-slate-800 pb-2.5">
          <span>💡</span> <span>秒记逻辑锚点 (Cognitive Mnemonic Hook)</span>
        </div>
        <div class="space-y-2">
          ${showZh && mnemZh ? `<div class="text-xs text-emerald-200 leading-relaxed bg-emerald-950/20 p-3 rounded-lg border border-emerald-900/40">${mnemZh}</div>` : ''}
          ${showEn && mnemEn ? `<div class="text-xs text-emerald-200/90 italic leading-relaxed bg-emerald-950/30 p-3 rounded-lg border border-emerald-900/40">${mnemEn}</div>` : ''}
        </div>
      </div>

    </div>

    <!-- Raw JSON Collapsible -->
    <details class="bg-slate-950 border border-slate-800 rounded-xl p-4 text-xs font-mono text-slate-400">
      <summary class="cursor-pointer text-slate-400 hover:text-sky-400 font-sans font-semibold">🔍 查看此词全维度中英双语原生 JSON (开发者规范视图)</summary>
      <pre class="mt-3 p-4 bg-slate-900 rounded-lg overflow-x-auto text-slate-300">${JSON.stringify(w, null, 2)}</pre>
    </details>
  `;
}

renderTabs();
renderWordDetail();
</script>
</body>
</html>
