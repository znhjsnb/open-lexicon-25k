<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9f8">
  <meta name="description" content="Open-Lexicon：25,006 个英语词汇的双语学习词典。查释义，听例句，理解构词与词源。">
  <title>Open-Lexicon · 把单词读懂</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23245d50'/%3E%3Ctext x='8' y='24' font-size='25' font-family='Georgia' fill='white'%3El%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#content">跳至词条内容</a>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Open-Lexicon 首页"><span class="brand-mark" aria-hidden="true">l<span>·</span></span><span>Open-Lexicon<small>把单词读懂</small></span><span class="edition">25K</span></a>
    <nav aria-label="学习工具">
      <button class="nav-button" id="daily" aria-label="每日一词"><span aria-hidden="true">☀</span> 每日一词</button>
      <button class="nav-button" id="practice"><span aria-hidden="true">▱</span> 备考抽认</button>
      <span class="nav-divider"></span>
      <button class="icon-button" id="theme" aria-label="切换深色主题" title="切换主题">◐</button>
      <button class="nav-button focus-button" id="focus" aria-pressed="false"><span aria-hidden="true">⛶</span> <span>沉浸阅读</span></button>
    </nav>
  </header>
  <main class="workspace">
    <aside class="sidebar" aria-label="查词">
      <div class="search-area">
        <div class="sidebar-heading"><h1>发现一个词</h1><span>英汉双语词典</span></div>
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <input id="search" type="search" placeholder="搜索单词或中文释义" aria-label="搜索单词或中文释义" autocomplete="off" spellcheck="false" maxlength="120" aria-controls="word-list" aria-describedby="search-help">
          <button id="clear" class="clear-button" aria-label="清除搜索" hidden>×</button><kbd id="search-key">/</kbd>
        </div>
        <p id="search-help">↑↓ 切换词条 · Enter 开始阅读</p>
        <div id="filters" class="filters" role="group" aria-label="考试范围"></div>
        <button id="bookmarks" class="bookmark-filter" aria-pressed="false">☆ 我的收藏 <span id="bookmark-count">0</span></button>
      </div>
      <div class="results-meta"><span id="result-count" role="status">正在准备词库…</span><select id="pos-filter" aria-label="词性筛选"><option value="">全部词性</option value="n.">名词</option><option value="v.">动词</option><option value="adj.">形容词</option><option value="adv.">副词</option><option value="prep.">介词</option><option value="conj.">连词</option><option value="pron.">代词</option></select><span id="search-time"></span></div>
      <div id="word-list" class="word-list" role="listbox" aria-label="词条结果" tabindex="0" aria-busy="true"></div>
      <div class="list-paging"><button id="previous" aria-label="上一页">←</button><span id="page-label">每页 50 词</span><button id="next" aria-label="下一页">→</button></div>
      <footer class="sidebar-footer"><span id="connection"><i></i> 正在载入</span><button id="offline-download" title="下载全部字母分片，约 45 MiB，可随时暂停">准备离线词库</button></footer>
    </aside>
    <section id="content" class="content" tabindex="-1" aria-label="词条详情" aria-busy="true">
      <div class="content-toolbar"><button id="back" class="text-button mobile-only">← 返回词表</button><span id="breadcrumb">词典 / 开始探索</span><span class="toolbar-actions"><button id="save" class="icon-button" aria-label="收藏单词" aria-pressed="false" disabled>☆</button><button id="copy" class="icon-button" aria-label="复制词条 Markdown" title="复制词条" disabled>⧉</button><button id="copy-anki" class="text-button" title="复制 Anki TSV" disabled>Anki</button></span></div>
      <article id="detail" class="entry"><div class="welcome"><span class="welcome-glyph">Aa</span><h2>每一个词，都有来处。</h2><p>正在为你打开 25,006 个词的世界…</p></div></article>
      <footer class="reading-footer"><span>Open-Lexicon 25K</span><span>读懂 · 听见 · 记住</span></footer>
    </section>
  </main>
  <dialog id="study" class="study-dialog" aria-labelledby="study-title">
    <div class="drawer-heading"><div><span class="small-label" id="study-kind">留一点时间给学习</span><h2 id="study-title">今日的词语练习</h2></div><button id="close-study" class="icon-button" aria-label="关闭学习抽屉">×</button></div>
    <div class="study-stats"><div><strong id="studied">0</strong><span>今日已记住</span></div><div><strong id="streak">0</strong><span>连续学习天数</span></div></div>
    <p id="study-progress" class="study-progress" role="status"></p>
    <button id="flashcard" class="flashcard" aria-label="翻开释义" aria-pressed="false"><span class="flip-inner"><span class="card-front"><span class="small-label">先想一想它的意思</span><strong id="card-word">…</strong><span id="card-phonetic"></span><span class="flip-hint">点击翻开释义 <span aria-hidden="true">↻</span></span></span><span class="card-back" aria-hidden="true"><span class="small-label">你想起来了吗？</span><span id="card-meaning"></span><span class="flip-hint">点击回到词面 ↻</span></span></span></button>
    <div class="study-controls"><button id="study-again" class="secondary-button">再看一次</button><button id="study-known" class="primary-button">记住了 ✓</button></div>
    <button id="study-open" class="text-button study-open">在词典中细读</button>
    <p class="drawer-note">每天一点，让词汇慢慢成为你的语言。<br>学习进度仅保存在这台设备。</p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
  <noscript>请启用 JavaScript 以使用本地词典检索。</noscript>
</body>
</html>
